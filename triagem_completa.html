/**
 * Gerador de Bookmarklet Universal do PJe:
 * - Sem hardcode de tribunal (opera dinamicamente sobre location.origin do PJe);
 * - Agrupamento nacional padronizado (12 = Triagem);
 * - Sanitização estrita de dados sensíveis na fonte (LGPD: remove CPFs e e-mails);
 * - Baixa automaticamente o arquivo .txt com os processos sanitizados para carregar no app.
 * 
 * @returns {string} Código javascript:... pronto para favoritos
 */
function gerarCodigoBookmarkletUniversal() {
  const fnCorpo = `(function () {
  var AGRUPAMENTO = 12;
  var TAMANHO_PAGINA = 500;
  var CONCORRENCIA = 5;
  var API_BASE = location.origin + '/pje-comum-api/api';

  function getCookie(name) {
    var cookies = document.cookie.split(';');
    for (var i = 0; i < cookies.length; i++) {
      var c = cookies[i].trim();
      if (c.indexOf(name + '=') === 0) {
        return decodeURIComponent(c.substring(name.length + 1));
      }
    }
    return null;
  }

  function criarAviso() {
    var div = document.createElement('div');
    div.id = 'triagem-pje-aviso';
    div.style.cssText = 'position:fixed;top:20px;right:20px;z-index:9999999;background:#0f172a;color:#ffffff;padding:16px 22px;border-radius:12px;font:14px/1.5 system-ui,-apple-system,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,0.45);max-width:340px;border:1px solid #334155;';
    div.innerHTML = '<div style="font-weight:800;color:#facc15;margin-bottom:6px;display:flex;align-items:center;gap:6px;"><span>⚠️</span> NÃO FECHE ESTA ABA</div>' +
      '<div id="triagem-pje-msg" style="font-size:13px;opacity:0.95;margin-bottom:8px;">Conectando ao PJe...</div>' +
      '<div style="background:#1e293b;border-radius:6px;overflow:hidden;height:6px;"><div id="triagem-pje-bar" style="background:#38bdf8;width:0%;height:100%;transition:width 0.2s;"></div></div>';
    document.body.appendChild(div);
    return div;
  }

  function atualizarStatus(div, texto, pct) {
    var msg = div.querySelector('#triagem-pje-msg');
    var bar = div.querySelector('#triagem-pje-bar');
    if (msg) msg.textContent = texto;
    if (bar && typeof pct === 'number') bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
  }

  function sanitizarParte(p) {
    if (!p || typeof p !== 'object') return p;
    var c = Object.assign({}, p);
    delete c.emails;
    delete c.email;
    delete c.cpf;
    delete c.dddCelular;
    delete c.numeroCelular;
    if (c.tipoDocumento === 'CPF') delete c.documento;
    if (c.pessoaFisica) {
      var pf = Object.assign({}, c.pessoaFisica);
      delete pf.login;
      delete pf.cpf;
      delete pf.dataNascimento;
      delete pf.nomeGenitora;
      delete pf.nomeGenitor;
      c.pessoaFisica = pf;
    }
    if (Array.isArray(c.representantes)) {
      c.representantes = c.representantes.map(function (r) {
        var rep = Object.assign({}, r);
        delete rep.cpf;
        delete rep.documento;
        delete rep.emails;
        delete rep.email;
        delete rep.dddCelular;
        delete rep.numeroCelular;
        return rep;
      });
    }
    return c;
  }

  function sanitizarPartesDict(partesDict) {
    if (!partesDict || typeof partesDict !== 'object') return partesDict;
    var out = {};
    for (var polo in partesDict) {
      if (Object.prototype.hasOwnProperty.call(partesDict, polo)) {
        out[polo] = (partesDict[polo] || []).map(sanitizarParte);
      }
    }
    return out;
  }

  function baixarArquivoTxt(nomeArquivo, linhas) {
    var texto = linhas.map(function (o) { return JSON.stringify(o); }).join('\\n') + '\\n';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto], { type: 'text/plain;charset=utf-8' }));
    a.download = nomeArquivo;
    a.click();
  }

  async function buscarPagina(pagina, xsrf) {
    var res = await fetch(API_BASE + '/agrupamentotarefas/' + AGRUPAMENTO + '/processos', {
      method: 'PATCH',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': xsrf },
      body: JSON.stringify({
        pagina: pagina,
        tamanhoPagina: TAMANHO_PAGINA,
        subCaixa: null, tipoAtividade: null, processos: null,
        nomeConclusoMagistrado: null, usuarioResponsavel: null,
        faseProcessualString: null, numeroProcesso: null,
        juizoDigital: false, filtroImpedimento: false,
        ordenacaoColuna: null, condicaoNegativaNosItensSelecionados: false,
        expedientesPreparados: false, ordenacaoCrescente: true,
        filtrarPorResponsavel: false
      })
    });
    if (!res.ok) throw new Error('Falha ao listar triagem: HTTP ' + res.status);
    return res.json();
  }

  async function getJson(path, xsrf) {
    var res = await fetch(API_BASE + path, {
      credentials: 'include',
      headers: { 'X-XSRF-TOKEN': xsrf }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' em ' + path);
    return res.json();
  }

  async function buscarDetalhes(idProc, xsrf) {
    var resultados = await Promise.all([
      getJson('/processos/id/' + idProc, xsrf),
      getJson('/processos/id/' + idProc + '/partes', xsrf),
      getJson('/processos/id/' + idProc + '/assuntos', xsrf)
    ]);
    return {
      processo: resultados[0],
      partes: sanitizarPartesDict(resultados[1]),
      assuntos: resultados[2]
    };
  }

  async function executarEmParalelo(itens, limite, workerFn) {
    var idx = 0;
    var total = itens.length;
    async function worker() {
      while (idx < total) {
        var cur = idx++;
        await workerFn(itens[cur], cur, total);
      }
    }
    var pool = [];
    for (var w = 0; w < Math.min(limite, total); w++) {
      pool.push(worker());
    }
    await Promise.all(pool);
  }

  async function iniciar() {
    var aviso = criarAviso();
    try {
      var xsrf = getCookie('Xsrf-Token');
      if (!xsrf) throw new Error('Cookie de sessão Xsrf-Token não encontrado. Verifique se está logado no PJe nesta aba.');

      atualizarStatus(aviso, 'Buscando tarefas do agrupamento de triagem...', 10);
      var pagina = 1;
      var listaProcessos = [];
      var primeira = await buscarPagina(pagina, xsrf);
      listaProcessos = listaProcessos.concat(primeira.resultado || []);

      while (pagina < (primeira.qtdPaginas || 1)) {
        pagina++;
        var prox = await buscarPagina(pagina, xsrf);
        listaProcessos = listaProcessos.concat(prox.resultado || []);
      }

      var pendentes = listaProcessos.filter(function (p) {
        return !p.idUsuarioResponsavelSecretaria;
      });

      if (pendentes.length === 0) {
        pendentes = listaProcessos;
      }

      var total = pendentes.length;
      var out = new Array(total);
      var concluidos = 0;

      atualizarStatus(aviso, 'Extraindo detalhes de ' + total + ' processos...', 20);

      await executarEmParalelo(pendentes, CONCORRENCIA, async function (p, i, tot) {
        try {
          var det = await buscarDetalhes(p.id, xsrf);
          out[i] = {
            cnj: p.numeroProcesso,
            idProcesso: p.id,
            listagem: p,
            processo: det.processo,
            partes: det.partes,
            assuntos: det.assuntos
          };
        } catch (e) {
          out[i] = {
            cnj: p.numeroProcesso,
            idProcesso: p.id,
            erro: String(e && e.message || e)
          };
        }
        concluidos++;
        var pct = 20 + Math.round((concluidos / tot) * 75);
        atualizarStatus(aviso, 'Baixando e sanitizando: ' + concluidos + '/' + tot + ' (' + Math.round((concluidos / tot) * 100) + '%)', pct);
      });

      var outValidos = out.filter(Boolean);
      var hoje = new Date().toISOString().slice(0, 10);
      var nomeArquivo = 'triagem_pje_' + hoje + '.txt';

      // Download direto do arquivo .txt contendo os processos sanitizados
      baixarArquivoTxt(nomeArquivo, outValidos);

      atualizarStatus(aviso, '✅ Concluído! ' + outValidos.length + ' processos exportados. O arquivo ' + nomeArquivo + ' foi baixado.', 100);
      setTimeout(function () {
        if (aviso && aviso.parentNode) aviso.parentNode.removeChild(aviso);
      }, 7000);
    } catch (err) {
      atualizarStatus(aviso, '❌ Erro: ' + (err.message || err), 0);
      setTimeout(function () {
        if (aviso && aviso.parentNode) aviso.parentNode.removeChild(aviso);
      }, 12000);
    }
  }

  iniciar();
})();`;

  return 'javascript:' + encodeURIComponent(fnCorpo);
}

/**
 * Camada de persistência local baseada em IndexedDB.
 * Mantém os dados na origem do app no navegador, sem salvar arquivos soltos em pastas do sistema.
 */

const DB_NAME = 'TriagemPJeDB';
const DB_VERSION = 1;
const STORE_NAME = 'processos';

function abrirDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') {
      return reject(new Error('IndexedDB não suportado neste ambiente'));
    }

    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'cnj' });
        store.createIndex('idProcesso', 'idProcesso', { unique: false });
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function salvarLote(listaProcessos) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);

    // Substituição limpa de sessão: limpa registros antigos para evitar misturar lotes
    store.clear();

    for (const item of listaProcessos) {
      if (!item) continue;
      const cnj = (item.cnj || (item.processo && item.processo.numero) || String(item.idProcesso)).trim();
      store.put(Object.assign({}, item, { cnj }));
    }

    tx.oncomplete = () => resolve(listaProcessos.length);
    tx.onerror = () => reject(tx.error);
  });
}

async function obterTodos() {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();

    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function limparSessao() {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.clear();

    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function contarProcessos() {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.count();

    req.onsuccess = () => resolve(req.result || 0);
    req.onerror = () => reject(req.error);
  });
}

/**
 * Módulo de transporte de dados via window.postMessage.
 * Valida origens autorizadas (PJe TRT e mesma origem) e evita envio irrestrito para wildcard (*).
 */

/**
 * Valida se a origem da mensagem provém de tribunal oficial (.jus.br), da mesma origem ou de localhost.
 * @param {string} origem
 * @returns {boolean}
 */
function ehOrigemValida(origem) {
  if (!origem || typeof origem !== 'string') return false;
  if (typeof location !== 'undefined' && origem === location.origin) return true;
  if (/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(origem)) return true;
  try {
    const url = new URL(origem);
    return url.hostname.endsWith('.jus.br');
  } catch {
    return false;
  }
}

function iniciarReceptorPostMessage(onDadosRecebidos) {
  if (typeof window === 'undefined') return;

  window.addEventListener('message', async (event) => {
    // Validação estrita de segurança de origem
    if (!ehOrigemValida(event.origin)) {
      return;
    }

    const data = event.data;
    if (!data || typeof data !== 'object') return;

    // Handshake: responde ao ping do bookmarklet direcionado à origem emissora
    if (data.tipo === 'TRIAGEM_PING') {
      if (event.source && typeof event.source.postMessage === 'function') {
        event.source.postMessage({ tipo: 'TRIAGEM_PONG', app: 'TRIAGEM_PJE' }, event.origin);
      }
      return;
    }

    // Carga de lote de processos
    if (data.tipo === 'TRIAGEM_PAYLOAD' && Array.isArray(data.dados)) {
      try {
        const sanitizados = data.dados.map(sanitizarProcessoLGPD);
        await salvarLote(sanitizados);
        if (typeof onDadosRecebidos === 'function') {
          onDadosRecebidos(sanitizados);
        }

        // Confirma recebimento direcionado à origem emissora
        if (event.source && typeof event.source.postMessage === 'function') {
          event.source.postMessage({ tipo: 'TRIAGEM_CONFIRMADO', total: sanitizados.length }, event.origin);
        }
      } catch (err) {
        console.error('Erro ao processar lote via postMessage:', err);
      }
    }
  });

  // Avisa a janela de origem se aberta pelo PJe
  if (window.opener && typeof window.opener.postMessage === 'function') {
    const targetOrigin = (document.referrer && ehOrigemValida(new URL(document.referrer).origin))
      ? new URL(document.referrer).origin
      : 'https://pje.trt2.jus.br';
    window.opener.postMessage({ tipo: 'TRIAGEM_PRONTA' }, targetOrigin);
  }
}


// --- Modulo: plugins/verificador_tempestividade.js ---
/**
 * Plugin Independente para Verificação de Tempestividade de Recursos Trabalhistas.
 * Baseado no modelo de dados do PJe (documentos_lote) e na legislação processual:
 * - CLT art. 775 (dias úteis)
 * - Lei 11.419/2006 art. 4º §§ 3º e 4º (regras do DJEN: D -> D+1 publicação -> D+2 início)
 * - CPC art. 183 e 180 (prazo em dobro para Fazenda Pública e MPT)
 * - CPC art. 218 § 4º (tempestividade de recurso prematuro/antecipado)
 */

// Feriados nacionais fixos (mês-dia)
const FERIADOS_NACIONAIS_FIXOS = new Set([
  '01-01', // Confraternização Universal
  '04-21', // Tiradentes
  '05-01', // Dia do Trabalho
  '09-07', // Independência
  '10-12', // N. Sra. Aparecida
  '11-02', // Finados
  '11-15', // Proclamação da República
  '11-20', // Dia da Consciência Negra
  '12-25'  // Natal
]);

/**
 * Verifica se uma data é dia útil.
 * @param {Date} data
 * @returns {boolean}
 */
function ehDiaUtil(data) {
  const diaSemana = data.getDay();
  if (diaSemana === 0 || diaSemana === 6) return false; // 0=Domingo, 6=Sábado

  const mm = String(data.getMonth() + 1).padStart(2, '0');
  const dd = String(data.getDate()).padStart(2, '0');
  const chave = `${mm}-${dd}`;

  return !FERIADOS_NACIONAIS_FIXOS.has(chave);
}

/**
 * Adiciona N dias úteis a uma data inicial.
 * @param {Date} dataInicial
 * @param {number} diasUteis
 * @returns {Date}
 */
function adicionarDiasUteis(dataInicial, diasUteis) {
  let cur = new Date(dataInicial.getTime());
  let contagem = 0;

  while (contagem < diasUteis) {
    cur.setDate(cur.getDate() + 1);
    if (ehDiaUtil(cur)) {
      contagem++;
    }
  }

  return cur;
}

/**
 * Calcula a quantidade de dias úteis entre duas datas (exclusivo inicio, inclusivo fim).
 * @param {Date} dataInicio
 * @param {Date} dataFim
 * @returns {number}
 */
function contarDiasUteisEntre(dataInicio, dataFim) {
  let cur = new Date(dataInicio.getTime());
  let contagem = 0;

  while (cur < dataFim) {
    cur.setDate(cur.getDate() + 1);
    if (cur > dataFim) break;
    if (ehDiaUtil(cur)) {
      contagem++;
    }
  }

  return contagem;
}

/**
 * A partir de um documento de recurso, localiza o ato decisório (Sentença/Decisão/Despacho/
 * Acórdão) imediatamente anterior a ele e a certidão de publicação no DJEN dentro do
 * intervalo (ato recorrido, protocolo do recurso]. Em execução o ato agravável costuma vir
 * tipado como Despacho (cod 7003) no PJe, não Sentença/Decisão; em 2º grau o ato é Acórdão
 * (cod 7000) — os quatro tipos entram na busca do ato recorrido. Restringir a certidão a
 * essa janela evita ancorar a contagem do prazo numa publicação de uma fase completamente
 * diferente do processo.
 */
function _localizarAtoRecorridoECertidao(docRecurso, docsOrdenados) {
  const dtProtocoloRecurso = new Date(docRecurso.juntadoEm || docRecurso.criadoEm);

  let docSentenca = null;
  for (let i = docsOrdenados.length - 1; i >= 0; i--) {
    const d = docsOrdenados[i];
    if (d === docRecurso) continue;
    const dt = new Date(d.juntadoEm || d.criadoEm);
    if (dt > dtProtocoloRecurso) continue;

    const cod = String(d.codigoTipoDocumento || '');
    const tipo = (d.tipo || '').toUpperCase();

    if (cod === '7007' || cod === '7001' || cod === '7003' || cod === '7000' || tipo === 'SENTENÇA' || tipo === 'DECISÃO' || tipo === 'DESPACHO' || tipo === 'ACÓRDÃO') {
      docSentenca = d;
      break;
    }
  }

  if (!docSentenca) {
    return { docSentenca: null, docCertidaoDjen: null };
  }

  const dtSentenca = new Date(docSentenca.juntadoEm || docSentenca.criadoEm);

  let docCertidaoDjen = null;
  for (let i = docsOrdenados.length - 1; i >= 0; i--) {
    const d = docsOrdenados[i];
    const dt = new Date(d.juntadoEm || d.criadoEm);
    if (dt > dtProtocoloRecurso) continue;
    if (dt < dtSentenca) break;

    const cod = String(d.codigoTipoDocumento || '');
    const titulo = (d.titulo || '').toUpperCase();
    const signatario = (d.signatario || '').toUpperCase();

    if (
      (cod === '7323' && titulo.includes('DJEN')) ||
      titulo.includes('PUBLICAÇÃO NO DJEN') ||
      titulo.includes('PUBLICACAO NO DJEN') ||
      (cod === '7323' && signatario.includes('PROCEDIMENTO AUTOMATIZADO - PJE'))
    ) {
      docCertidaoDjen = d;
      break;
    }
  }

  return { docSentenca, docCertidaoDjen };
}

/**
 * Avalia a tempestividade de um único recurso da timeline contra o ato que ele
 * efetivamente impugna (achado por _localizarAtoRecorridoECertidao).
 */
function _avaliarRecurso(docRecurso, docsOrdenados, ehFazendaPublica) {
  const dtProtocoloRecurso = new Date(docRecurso.juntadoEm || docRecurso.criadoEm);
  const tipoRecurso = docRecurso.tipo || docRecurso.titulo || 'Recurso Trabalhista';

  const { docSentenca, docCertidaoDjen } = _localizarAtoRecorridoECertidao(docRecurso, docsOrdenados);

  if (!docSentenca) {
    return {
      status: 'SENTENCA_NAO_ENCONTRADA',
      tempestivo: null,
      tipoRecurso,
      dataProtocolo: dtProtocoloRecurso.toISOString(),
      detalhes: 'Não foi possível identificar o ato decisório recorrido imediatamente anterior a este recurso.'
    };
  }

  const dtSentenca = new Date(docSentenca.juntadoEm || docSentenca.criadoEm);

  // Definição do prazo legal (CLT art. 775 / CPC art. 183): ED tem 5 dias, RO/AP têm 8.
  // Usa `tipo` (campo estruturado), não `titulo` (texto livre) — mesmo motivo do filtro em
  // docsRecurso: título livre classifica errado cópias/anexos que citam "embargos" no nome.
  const cod = String(docRecurso.codigoTipoDocumento || '');
  const tipoDoc = (docRecurso.tipo || '').toUpperCase();
  const ehEmbargos = cod === '49' || tipoDoc.includes('EMBARGOS DE DECLARAÇÃO') || tipoDoc.includes('EMBARGOS DE DECLARACAO');
  const prazoBase = ehEmbargos ? 5 : 8;
  const prazoMaximoDias = ehFazendaPublica ? prazoBase * 2 : prazoBase;

  // Se o recurso foi protocolado ANTES da certidão do DJEN ou mesmo no dia da sentença
  // Conforme CPC art. 218, § 4º: recurso interposto antes do início do prazo é tempestivo
  if (!docCertidaoDjen || dtProtocoloRecurso <= new Date(docCertidaoDjen.juntadoEm || docCertidaoDjen.criadoEm)) {
    return {
      status: 'TEMPESTIVO',
      tempestivo: true,
      prematuro: true,
      prazoMaximoDias,
      tipoRecurso,
      dataAtoRecorrido: dtSentenca.toISOString(),
      dataDisponibilizacaoDJEN: docCertidaoDjen ? new Date(docCertidaoDjen.juntadoEm).toISOString() : null,
      termoInicial: 'Imediato (pré-publicação / ciência inequívoca)',
      termoFinal: 'Art. 218, § 4º, CPC',
      dataProtocolo: dtProtocoloRecurso.toISOString(),
      diasUteisDecorridos: 0,
      ehFazendaPublica,
      detalhes: `Recurso interposto antes ou no momento da publicação oficial no DJEN (CPC, art. 218, § 4º). Tempestivo.`
    };
  }

  // Cálculo do DJEN segundo Lei 11.419/2006: D = Data de Disponibilização (juntadoEm da certidão)
  const dtDisponibilizacao = new Date(docCertidaoDjen.juntadoEm || docCertidaoDjen.criadoEm);

  // Data de Publicação = 1º dia útil após disponibilização
  let dtPublicacao = new Date(dtDisponibilizacao.getTime());
  do {
    dtPublicacao.setDate(dtPublicacao.getDate() + 1);
  } while (!ehDiaUtil(dtPublicacao));

  // Termo Inicial (Dia 1 do prazo) = 1º dia útil após a publicação
  let dtTermoInicial = new Date(dtPublicacao.getTime());
  do {
    dtTermoInicial.setDate(dtTermoInicial.getDate() + 1);
  } while (!ehDiaUtil(dtTermoInicial));

  // Termo Final = Termo Inicial + (prazoMaximoDias - 1) dias úteis
  const dtTermoFinal = adicionarDiasUteis(dtTermoInicial, prazoMaximoDias - 1);
  dtTermoFinal.setHours(23, 59, 59, 999);

  // Contagem de dias úteis decorridos do termo inicial até o protocolo
  let diasDecorridos = 0;
  if (dtProtocoloRecurso < dtTermoInicial) {
    diasDecorridos = 0;
  } else {
    // Conta os dias úteis entre dtTermoInicial e dtProtocoloRecurso inclusive
    diasDecorridos = contarDiasUteisEntre(new Date(dtTermoInicial.getTime() - 86400000), dtProtocoloRecurso);
  }

  const tempestivo = dtProtocoloRecurso <= dtTermoFinal;

  return {
    status: tempestivo ? 'TEMPESTIVO' : 'INTEMPESTIVO',
    tempestivo,
    prematuro: false,
    prazoMaximoDias,
    tipoRecurso,
    dataAtoRecorrido: dtSentenca.toISOString(),
    dataDisponibilizacaoDJEN: dtDisponibilizacao.toISOString(),
    dataPublicacaoDJEN: dtPublicacao.toISOString(),
    termoInicial: dtTermoInicial.toISOString(),
    termoFinal: dtTermoFinal.toISOString(),
    dataProtocolo: dtProtocoloRecurso.toISOString(),
    diasUteisDecorridos: diasDecorridos,
    ehFazendaPublica,
    detalhes: tempestivo
      ? `Protocolado em ${diasDecorridos}º dia útil (prazo de ${prazoMaximoDias} dias úteis${ehFazendaPublica ? ' - em dobro' : ''}). Tempestivo.`
      : `Protocolado após o vencimento do ${prazoMaximoDias}º dia útil. Excedeu em ${diasDecorridos - prazoMaximoDias} dias úteis.`
  };
}

/**
 * Analisa a tempestividade de TODOS os recursos (RO/AP/ED) constantes na lista de
 * documentos de um processo. Um processo de execução com histórico longo pode ter várias
 * fases recursais, cada uma contra um ato diferente — analisar só "o" recurso, escolhido
 * por posição na timeline, pareia errado sempre que há mais de um.
 * @param {Array<Object>} documentos - Array de documentos retornados pela API do PJe
 * @param {boolean} ehFazendaPublica - Flag indicando se a parte recorrente goza de prerrogativa fazendária
 * @returns {Object} Parecer de tempestividade do pior recurso (ou do mais recente, se nenhum
 *   for intempestivo), com o array `recursos` trazendo o parecer individual de cada um.
 */
function analisarTempestividadeProcesso(documentos = [], ehFazendaPublica = false) {
  if (!Array.isArray(documentos) || documentos.length === 0) {
    return {
      status: 'SEM_DOCUMENTOS',
      tempestivo: null,
      detalhes: 'Nenhum documento disponível para análise.'
    };
  }

  // Ordena documentos cronologicamente (juntadoEm ASC)
  const docsOrdenados = documentos.slice().sort((a, b) => {
    const da = new Date(a.juntadoEm || a.criadoEm || 0);
    const db = new Date(b.juntadoEm || b.criadoEm || 0);
    return da.getTime() - db.getTime();
  });

  // Localiza TODOS os recursos da timeline (RO, AP, ED)
  // Códigos TPU: 69 (Recurso Ordinário), 7154 (Agravo de Petição), 49 (Embargos de Declaração)
  const docsRecurso = [];
  for (const d of docsOrdenados) {
    const cod = String(d.codigoTipoDocumento || '');

    // Sentença/Decisão/Despacho/Acórdão (7007/7001/7003/7000) são sempre atos do juízo,
    // nunca petição de parte — mesmo quando o título é "Sentença/Decisão - Embargos de
    // Declaração" (o juízo RESOLVENDO embargos, não a parte interpondo). Excluir antes do
    // match evita que essas decisões entrem como se fossem o próprio recurso.
    if (cod === '7007' || cod === '7001' || cod === '7003' || cod === '7000') continue;

    const tipo = (d.tipo || '').toUpperCase();

    // O fallback de texto usa `tipo` (campo estruturado/classificado pelo PJe), nunca
    // `titulo` (texto livre digitado por quem junta o documento). Um "Documento Diverso"
    // pode ter título "Embargos de Declaração" só porque é uma CÓPIA de embargos de outro
    // processo anexada como prova — visto na prática num lote de anexos numerados
    // ("5 embargos de declaração ID ...", "6 decisão dos embargos ID ...") juntados de uma
    // vez com o mesmo timestamp. `tipo` desse tipo de anexo continua "Documento Diverso".
    if (
      cod === '69' || tipo.includes('RECURSO ORDINÁRIO') || tipo.includes('RECURSO ORDINARIO') ||
      cod === '7154' || tipo.includes('AGRAVO DE PETIÇÃO') || tipo.includes('AGRAVO DE PETICAO') ||
      cod === '49' || tipo.includes('EMBARGOS DE DECLARAÇÃO') || tipo.includes('EMBARGOS DE DECLARACAO')
    ) {
      docsRecurso.push(d);
    }
  }

  if (docsRecurso.length === 0) {
    return {
      status: 'RECURSO_NAO_IDENTIFICADO',
      tempestivo: null,
      detalhes: 'Nenhuma petição de recurso (RO, AP ou ED) foi localizada na timeline dos autos.'
    };
  }

  const recursos = docsRecurso.map(d => ({
    idDocumento: d.id,
    ..._avaliarRecurso(d, docsOrdenados, ehFazendaPublica)
  }));

  // Verdito do processo: intempestivo se QUALQUER recurso da timeline foi. Entre vários
  // intempestivos, expõe no topo o de maior atraso; sem nenhum, expõe o mais recente
  // (mantém o formato de retorno compatível com timelines de um único recurso).
  const intempestivos = recursos.filter(r => r.status === 'INTEMPESTIVO');
  const principal = intempestivos.length > 0
    ? intempestivos.reduce((pior, r) =>
        (r.diasUteisDecorridos - r.prazoMaximoDias) > (pior.diasUteisDecorridos - pior.prazoMaximoDias) ? r : pior)
    : recursos[recursos.length - 1];

  return { ...principal, recursos };
}

/**
 * Módulo de Exportação de Relatório Completo de Triagem para Impressão e PDF.
 * Gera documento com formatação institucional do TRT-2, sem expor nomes de advogados
 * e com eufemismo de processos semelhantes.
 */

function exportarRelatorioPdf({ processos = [], estatisticas = {}, clustersSeriais = {} }) {
  const dataHoje = new Date().toLocaleString('pt-BR');
  const lotesEscala = (clustersSeriais && clustersSeriais.clusters) || [];

  // 1. Agrupamento por Reclamada com extração de CNPJs reais
  const mapaReclamadas = new Map();
  for (const p of processos) {
    const passivos = (p.partes && p.partes.passivos) || [];
    for (const r of passivos) {
      const nome = (r.nome || '').trim();
      if (!nome) continue;
      const chave = nome.toUpperCase();
      if (!mapaReclamadas.has(chave)) {
        mapaReclamadas.set(chave, { nome, cnpjs: new Set(), total: 0 });
      }
      const reg = mapaReclamadas.get(chave);
      reg.total++;
      
      const doc = r.documento || r.cnpj || (r.pessoaJuridica && r.pessoaJuridica.cnpj) || r.numeroDocumento || null;
      if (doc && (doc.includes('/') || (r.tipoDocumento && String(r.tipoDocumento).toUpperCase() === 'CNPJ'))) {
        reg.cnpjs.add(doc.trim());
      }
    }
  }

  const topReclamadas = Array.from(mapaReclamadas.values())
    .filter(r => r.total >= 2)
    .sort((a, b) => b.total - a.total);

  // 2. Fazenda sem MPT
  const fazendaSemMpt = processos.filter(p => p.pjs && p.pjs.temFazendaPublica && p.partes && !p.partes.mptPresente);

  // 3. Físicos
  const fisicosMigrados = processos.filter(p => p.temporalidade && p.temporalidade.ehProcessoFisicoMigrado);

  const htmlRelatorio = `<!DOCTYPE html>

  <style>

      background: #ffffff;
      margin: 0;
      padding: 0;
    }

      border-bottom: 2px solid #1e3a8a;

      margin-bottom: 16px;
    }

      font-size: 16pt;
      font-weight: 800;
      color: #1e3a8a;
      margin: 0 0 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .header-institucional .subtitulo {
      font-size: 10pt;
      color: #475569;
      margin: 0;
    }
    .quadro-metricas {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .card-metrica {
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 8px 10px;
      background: #f8fafc;
    }
    .card-metrica .label {
      font-size: 8pt;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
    }
    .card-metrica .valor {
      font-size: 14pt;
      font-weight: 800;
      color: #0f172a;
      margin-top: 2px;
    }
    h2 {
      font-size: 12pt;
      color: #1e3a8a;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 4px;
      margin-top: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    }

      page-break-inside: avoid;

    th {
      background: #f1f5f9;
      color: #334155;
      font-weight: 700;
      text-align: left;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      font-size: 8.5pt;
      text-transform: uppercase;
    }
    td {
      padding: 6px 8px;
      border: 1px solid #e2e8f0;
      vertical-align: top;
    }
    .badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 8pt;
      font-weight: 700;
    }
    .badge-alerta {
      background: #fee2e2;
      color: #b91c1c;
    }
    .badge-escala {
      background: #fef08a;
      color: #854d0e;
    }
    .badge-fisico {
      background: #ffedd5;
      color: #c2410c;
    }
    .btn-imprimir {
      padding: 8px 16px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;

    @media print {
      .btn-imprimir {
        display: none !important;
      }

</head>
<body>
  <button class="btn-imprimir" onclick="window.print()">Imprimir / Salvar como PDF</button>

  <div class="header-institucional">
    <h1>Tribunal Regional do Trabalho da 2ª Região</h1>
    <div class="subtitulo">Gabinete / Assessoria de Turma — Relatório Sintético de Triagem Prévia de Pauta</div>
    <div class="subtitulo">Emissão em: <strong>${dataHoje}</strong> | Volume Analisado: <strong>${processos.length} processos</strong></div>
  </div>

  <div class="quadro-metricas">
    <div class="card-metrica">
      <div class="label">Total Processos</div>
      <div class="valor">${processos.length}</div>
    </div>
    <div class="card-metrica">
      <div class="label">Fase de Conhecimento</div>
      <div class="valor">${estatisticas.conhecimento || 0}</div>
    </div>
    <div class="card-metrica">
      <div class="label">Fase de Execução</div>
      <div class="valor">${estatisticas.execucao || 0}</div>
    </div>
    <div class="card-metrica">
      <div class="label">Fazenda sem MPT</div>
      <div class="valor" style="color:#b91c1c;">${fazendaSemMpt.length}</div>
    </div>
    <div class="card-metrica">
      <div class="label">Processos Semelhantes</div>
      <div class="valor" style="color:#854d0e;">${lotesEscala.length} lotes</div>
    </div>
    <div class="card-metrica">
      <div class="label">Processos em Lotes</div>
      <div class="valor" style="color:#854d0e;">${clustersSeriais.totalProcessosEmLoteSerial || 0}</div>
    </div>
    <div class="card-metrica">
      <div class="label">Processos Físicos</div>
      <div class="valor" style="color:#c2410c;">${fisicosMigrados.length}</div>
    </div>
    <div class="card-metrica">
      <div class="label">Entidades Sindicais</div>
      <div class="valor" style="color:#0f766e;">${estatisticas.comSindicato || 0}</div>
    </div>
  </div>

  <h2>1. Processos Semelhantes Identificados (${lotesEscala.length})</h2>
  ${lotesEscala.length === 0 ? '<p>Nenhum lote com pedidos idênticos identificado.</p>' : `
    <table>
      <thead>
        <tr>
          <th style="width:25%;">Critério de Agrupamento</th>
          <th style="width:10%;">Qtd</th>
          <th style="width:25%;">Pedidos / Matérias</th>
          <th>Processos do Grupo (CNJ e Partes)</th>
        </tr>
      </thead>
      <tbody>
        ${lotesEscala.map(l => `
          <tr>
            <td><strong>${escapeHtml((l.razoes || ['mesmo cadastro de OAB', 'assuntos idênticos']).join(' • '))}</strong></td>
            <td><strong>${l.qtdProcessos} proc.</strong></td>
            <td>${escapeHtml(l.assuntosResumo)}</td>
            <td>
              <ul style="margin:0;padding-left:14px;font-size:8.5pt;">
                ${(l.processosRelacionados || []).map(pr => `
                  <li><span style="font-family:monospace;font-weight:600;">${escapeHtml(pr.cnj)}</span> [${escapeHtml(pr.siglaClasse)}] - ${escapeHtml(pr.tituloPartes)}</li>
                `).join('')}
              </ul>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `}

  <h2>2. Concentração por Reclamada (${topReclamadas.length} empresas com &ge; 2 processos)</h2>
  ${topReclamadas.length === 0 ? '<p>Sem concentração relevante de reclamadas no lote.</p>' : `
    <table>
      <thead>
        <tr>
          <th style="width:50%;">Reclamada</th>
          <th style="width:15%;">Processos</th>
          <th>CNPJs Vinculados</th>
        </tr>
      </thead>
      <tbody>
        ${topReclamadas.map(r => `
          <tr>
            <td><strong>${escapeHtml(r.nome)}</strong></td>
            <td><strong>${r.total} processos</strong></td>
            <td style="font-family:monospace;font-size:8.5pt;">${Array.from(r.cnpjs).join(', ') || '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `}

  <h2>3. Alertas Críticos — Fazenda Pública com Necessidade de Inclusão do MPT (${fazendaSemMpt.length})</h2>
  ${fazendaSemMpt.length === 0 ? '<p>Nenhum processo com pendência de inclusão do Ministério Público do Trabalho.</p>' : `
    <table>
      <thead>
        <tr>
          <th style="width:25%;">Processo / Classe</th>
          <th style="width:40%;">Partes</th>
          <th>Providência Recomendada</th>
        </tr>
      </thead>
      <tbody>
        ${fazendaSemMpt.map(p => `
          <tr>
            <td><strong style="font-family:monospace;">${escapeHtml(p.cnj)}</strong><br><span class="badge" style="background:#f1f5f9;">${escapeHtml(p.classe.sigla)}</span></td>
            <td>${escapeHtml(p.partes.tituloPartes)}</td>
            <td><span class="badge badge-alerta">FAZENDA PÚBLICA — RETIFICAR AUTUAÇÃO PARA INCLUIR MPT</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `}

  <h2>4. Processos Físicos (${fisicosMigrados.length})</h2>
  ${fisicosMigrados.length === 0 ? '<p>Nenhum processo físico identificado.</p>' : `
    <table>
      <thead>
        <tr>
          <th style="width:25%;">Processo / Classe</th>
          <th style="width:50%;">Partes</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody>
        ${fisicosMigrados.map(p => `
          <tr>
            <td><strong style="font-family:monospace;">${escapeHtml(p.cnj)}</strong><br><span class="badge" style="background:#f1f5f9;">${escapeHtml(p.classe.sigla)}</span></td>
            <td>${escapeHtml(p.partes.tituloPartes)}</td>
            <td><span class="badge badge-fisico">Processo físico</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `}

  </body>
</html>
`;

  const win = window.open('', '_blank');
  if (win) {
    win.document.write(htmlRelatorio);
    win.document.close();
    win.focus();
    setTimeout(() => {
      try {
        win.print();
      } catch (err) {
        console.warn('Erro ao disparar impressão:', err);
      }
    }, 500);
  } else {
    alert('Por favor, autorize a abertura de popups para visualizar e imprimir o relatório em PDF.');
  }
}

        <div class="passos-bookmarklet-grid">
          <!-- Passo 1 -->
          <div class="card-passo">
            <div class="passo-numero">Passo 1</div>
            <div class="passo-titulo">Instale o Favorito</div>
            <p class="passo-desc">
              Arraste o botão verde abaixo para a <strong>barra de favoritos</strong> do seu navegador.
            </p>
            <div class="passo-acao">
              <a href="${urlBookmarklet}" id="link-bookmarklet-arrastar" class="btn-arrastar-bookmarklet" title="Clique e arraste este botão para sua barra de favoritos">
                ⭐ Coletar Triagem PJe
              </a>
            </div>
            <div style="margin-top:8px;display:flex;gap:6px;align-items:center;">
              <button type="button" id="btn-copiar-codigo-bm" class="btn-copiar-codigo-bm">Copiar Código</button>
              <span id="msg-copiado-bm" class="msg-copiado-bm" style="display:none;">Copiado!</span>
            </div>
            <div class="passo-dica">
              💡 <strong>Dica:</strong> Se a barra de favoritos não estiver visível, pressione <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>B</kbd>.
            </div>
          </div>

          <!-- Passo 2 -->
          <div class="card-passo">
            <div class="passo-numero">Passo 2</div>
            <div class="passo-titulo">Execute no PJe</div>
            <p class="passo-desc">
              No <strong>PJe</strong> (qualquer TRT), abra a tarefa de <strong>Triagem</strong> (Agrupamento 12) e clique no favorito <strong>"⭐ Coletar Triagem PJe"</strong>.
            </p>
            <div class="passo-dica" style="border-left-color: #0284c7; background: #f0f9ff; color: #0369a1;">
              📥 O robô coletará os processos com sanitização LGPD e baixará automaticamente o arquivo <code>triagem_pje_DATA.txt</code>.
            </div>
          </div>

          <!-- Passo 3 -->
          <div class="card-passo">
            <div class="passo-numero">Passo 3</div>
            <div class="passo-titulo">Carregue o Arquivo Aqui</div>
            <p class="passo-desc">
              Arraste o arquivo <code>.txt</code> baixado para a caixa de upload abaixo ou clique em <strong>"Selecionar Arquivo .txt"</strong>.
            </p>
            <div class="passo-dica" style="border-left-color: #16a34a; background: #f0fdf4; color: #15803d;">
              ⚡ A análise, filtros, identificação de Fazenda Pública e relatórios serão carregados instantaneamente!
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Interatividade da sanfona (recolher / expandir)
  const btnToggle = container.querySelector('#btn-toggle-sanfona');
  const corpoSanfona = container.querySelector('#corpo-sanfona');
  const iconeSeta = container.querySelector('#icone-seta-sanfona');

  if (btnToggle && corpoSanfona) {
    btnToggle.addEventListener('click', () => {
      const estaFechado = corpoSanfona.style.display === 'none';
      corpoSanfona.style.display = estaFechado ? 'block' : 'none';
      iconeSeta.textContent = estaFechado ? '▲' : '▼';
      btnToggle.setAttribute('aria-expanded', String(estaFechado));
      localStorage.setItem(CHAVE_STORAGE, String(!estaFechado));
    });
  }

  // Interatividade do botão copiar código
  const btnCopiar = container.querySelector('#btn-copiar-codigo-bm');
  const msgCopiado = container.querySelector('#msg-copiado-bm');
  if (btnCopiar) {
    btnCopiar.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(urlBookmarklet);
        if (msgCopiado) {
          msgCopiado.style.display = 'inline-block';
          setTimeout(() => { msgCopiado.style.display = 'none'; }, 3000);
        }
      } catch (err) {
        alert('Não foi possível copiar automaticamente. Arraste o botão verde para a barra de favoritos.');
      }
    });
  }
}


// --- Modulo: ui/painel_agrupamentos.js ---
/**
 * Painel Superior de Agrupamentos e Clusters Negociais:
 * - Concentração por Reclamada (com relação de CNPJs quando existentes)
 */

function renderizarPainelAgrupamentos(container, processos, clustersSeriais = [], onFiltrar) {
  if (!container) return;

  // 1. Agrupamento por Reclamada (Polo Passivo)
  const mapaReclamadas = new Map(); // nomeNorm -> { nome, cnpjs: Set, total: 0 }
  for (const p of processos) {
    const passivos = (p.partes && p.partes.passivos) || [];
    for (const r of passivos) {
      const nome = (r.nome || '').trim();
      if (!nome) continue;
      const chave = nome.toUpperCase();
      if (!mapaReclamadas.has(chave)) {
        mapaReclamadas.set(chave, { nome, cnpjs: new Set(), total: 0 });
      }
      const reg = mapaReclamadas.get(chave);
      reg.total++;

      // Extrai documento real (documento, cnpj ou pessoaJuridica.cnpj)
      const doc = r.documento || r.cnpj || (r.pessoaJuridica && r.pessoaJuridica.cnpj) || r.numeroDocumento || null;
      if (doc && (doc.includes('/') || (r.tipoDocumento && String(r.tipoDocumento).toUpperCase() === 'CNPJ'))) {
        reg.cnpjs.add(doc.trim());
      }
    }
  }

  const topReclamadas = Array.from(mapaReclamadas.values())
    .filter(r => r.total >= 2)
    .sort((a, b) => b.total - a.total)
    .slice(0, 10);

  container.innerHTML = `
    <div class="painel-agrupamentos-grid painel-reclamadas-apenas">
      <!-- Card Único: Top Reclamadas -->
      <div class="card-agrupamento card-reclamadas-completo">
        <div class="card-agrupamento-header">
          <span class="card-agrupamento-titulo">Mesma Reclamada</span>
          <span class="card-agrupamento-badge">${topReclamadas.length} empresas com múltiplos processos</span>
        </div>
        <div class="card-agrupamento-corpo grade-reclamadas-chips">
          ${topReclamadas.length === 0 ? '<p class="texto-vazio-card">Nenhuma repetição relevante de reclamada no lote.</p>' : ''}
          ${topReclamadas.map(r => {
            const cnpjsStr = r.cnpjs.size > 0 ? Array.from(r.cnpjs).join(', ') : '';
            return `
              <div class="item-agrupamento-clicavel" data-tipo="reclamada" data-valor="${encodeURIComponent(r.nome)}">
                <div class="item-agrupamento-topo">
                  <span class="item-nome" title="${r.nome}">${r.nome}</span>
                  <span class="item-qtd">${r.total} proc.</span>
                </div>
                ${cnpjsStr ? `<div class="item-subinfo" title="${cnpjsStr}">${cnpjsStr}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;

  // Event listeners para cliques de agrupamento por reclamada
  const itensClicaveis = container.querySelectorAll('.item-agrupamento-clicavel');
  itensClicaveis.forEach(el => {
    el.addEventListener('click', () => {
      const tipo = el.getAttribute('data-tipo');
      const valor = decodeURIComponent(el.getAttribute('data-valor'));
      if (typeof onFiltrar === 'function') {
        onFiltrar({ tipo, valor });
      }
    });
  });
}


// --- Modulo: ui/tabela.js ---



/**
 * Renderizador da tabela de processos da triagem.
 */

// Paleta de cores suaves para diferenciação de grupos de processos semelhantes
const CORES_LOTES_SEMELHANTES = [
  '#2563eb', // Azul
  '#d97706', // Âmbar
  '#059669', // Esmeralda
  '#7c3aed', // Roxo
  '#db2777', // Rosa
  '#0891b2'  // Ciano
];

function formatarDataDesde(dataIso) {
  if (!dataIso) return '—';
  try {
    const d = new Date(dataIso);
    if (isNaN(d.getTime())) return '—';
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const aaaa = d.getFullYear();
    const hh = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return `${dd}/${mm}/${aaaa} ${hh}:${min}`;
  } catch {
    return '—';
  }
}

function obterDataDesdeRaw(p) {
  return (p.raw && p.raw.listagem && p.raw.listagem.dataEntradaTarefa) ||
         (p.raw && p.raw.processo && p.raw.processo.dataInicio) ||
         (p.temporalidade && p.temporalidade.emTriagemDesde) || null;
}

function obterTimestampDesde(p) {
  const raw = obterDataDesdeRaw(p);
  return raw ? new Date(raw).getTime() : 0;
}

function formatarListaPartesPolo(listaPartes, rotuloPolo, cnjId) {
  if (!listaPartes || listaPartes.length === 0) return '';
  const visiveis = listaPartes.slice(0, 3);
  const restantes = listaPartes.slice(3);
  const idUnico = `polo-${rotuloPolo.toLowerCase()}-${cnjId.replace(/[^a-zA-Z0-9]/g, '')}`;

  let html = `<div class="bloco-polo" style="margin-bottom:4px;">`;
  html += `<span style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;">${escapeHtml(rotuloPolo)}:</span> `;
  
  const partesTxt = visiveis.map(p => {
    const nome = escapeHtml(p.nome || 'Parte sem nome');
    const doc = p.documento || p.cnpj || p.cpf || (p.pessoaJuridica && p.pessoaJuridica.cnpj) || p.numeroDocumento || null;
    const docStr = (doc && (doc.includes('/') || (p.tipoDocumento && String(p.tipoDocumento).toUpperCase() === 'CNPJ')))
      ? ` <span style="font-size:10px;color:#0369a1;font-weight:600;">(CNPJ ${escapeHtml(doc)})</span>`
      : '';
    return `<span style="font-size:12px;font-weight:500;color:#1e293b;">${nome}${docStr}</span>`;
  }).join(' <span style="color:#cbd5e1;">|</span> ');

  html += partesTxt;

  if (restantes.length > 0) {
    const restantesTxt = restantes.map(p => {
      const nome = escapeHtml(p.nome || 'Parte sem nome');
      const doc = p.documento || p.cnpj || p.cpf || (p.pessoaJuridica && p.pessoaJuridica.cnpj) || p.numeroDocumento || null;
      const docStr = (doc && (doc.includes('/') || (p.tipoDocumento && String(p.tipoDocumento).toUpperCase() === 'CNPJ')))
        ? ` <span style="font-size:10px;color:#0369a1;font-weight:600;">(CNPJ ${escapeHtml(doc)})</span>`
        : '';
      return `<div style="font-size:11px;color:#475569;padding:2px 0;">• ${nome}${docStr}</div>`;
    }).join('');

    html += `
      <button type="button" class="btn-ver-mais-partes" data-target="${idUnico}" style="background:none;border:none;color:#2563eb;font-size:11px;cursor:pointer;padding:0 4px;text-decoration:underline;">
        + ${restantes.length} partes (ver todas)
      </button>
      <div id="${idUnico}" class="container-partes-ocultas" style="display:none;margin-top:4px;padding:6px 8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;">
        ${restantesTxt}
      </div>
    `;
  }

  html += `</div>`;
  return html;
}

// Estado local de ordenação da tabela (padrão: mais antigos na tarefa primeiro)
let direcaoDesdeAsc = true;

function renderizarTabela(container, listaProcessos, selecionadosSet = new Set(), onSelecaoChange = null, estadoFiltros = {}) {
  if (!container) return;

  if (!listaProcessos || listaProcessos.length === 0) {
    container.innerHTML = `
      <div style="padding:40px;text-align:center;color:var(--text-muted, #64748b);font-size:14px;">
        Nenhum processo encontrado para os filtros selecionados.
      </div>
    `;
    return;
  }

  // Verifica se o filtro de processos semelhantes (escala) está ativo
  const filtroSemelhantesAtivo = !!(
    estadoFiltros.apenasContenciosoEscala ||
    (estadoFiltros.agrupamentoAtivo && (estadoFiltros.agrupamentoAtivo.tipo === 'escala' || estadoFiltros.agrupamentoAtivo.tipo === 'todos_escala'))
  );

  let processosOrdenados = listaProcessos.slice();

  // Mapeamento de cores para clusters de processos semelhantes
  const mapaCoresCluster = new Map();
  let indiceCor = 0;

  if (filtroSemelhantesAtivo) {
    // Agrupa processos por lote de semelhança e depois por data
    processosOrdenados.sort((a, b) => {
      const idA = (a.clusterEscala && a.clusterEscala.idCluster) || 'ZZZ';
      const idB = (b.clusterEscala && b.clusterEscala.idCluster) || 'ZZZ';
      if (idA !== idB) return idA.localeCompare(idB);

      const tA = obterTimestampDesde(a);
      const tB = obterTimestampDesde(b);
      return direcaoDesdeAsc ? (tA - tB) : (tB - tA);
    });

    for (const p of processosOrdenados) {
      if (p.clusterEscala && !mapaCoresCluster.has(p.clusterEscala.idCluster)) {
        mapaCoresCluster.set(p.clusterEscala.idCluster, CORES_LOTES_SEMELHANTES[indiceCor % CORES_LOTES_SEMELHANTES.length]);
        indiceCor++;
      }
    }
  } else {
    // Ordenação padrão: mais antigos na tarefa primeiro (ou conforme clique na coluna Desde)
    processosOrdenados.sort((a, b) => {
      const tA = obterTimestampDesde(a);
      const tB = obterTimestampDesde(b);
      return direcaoDesdeAsc ? (tA - tB) : (tB - tA);
    });
  }

  let rowsHtml = '';
  let idClusterAnterior = null;

  for (const p of processosOrdenados) {
    const cnj = escapeHtml(p.cnj);
    const siglaClasse = escapeHtml(p.classe.sigla);
    const rota = escapeHtml(p.classe.rota);
    const estaSelecionado = selecionadosSet.has(p.cnj);

    const dataDesdeStr = formatarDataDesde(obterDataDesdeRaw(p));

    // Cabeçalho divisório de grupo de processos semelhantes (quando filtro ativo)
    if (filtroSemelhantesAtivo && p.clusterEscala && p.clusterEscala.idCluster !== idClusterAnterior) {
      idClusterAnterior = p.clusterEscala.idCluster;
      const corLote = mapaCoresCluster.get(p.clusterEscala.idCluster) || '#2563eb';
      rowsHtml += `
        <tr class="linha-cabecalho-lote" style="background:#f8fafc;border-left:5px solid ${corLote};border-top:2px solid #cbd5e1;border-bottom:1px solid #cbd5e1;">
          <td colspan="6" style="padding:8px 12px;font-size:12px;font-weight:700;color:#1e293b;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span>GRUPO DE PROCESSOS SEMELHANTES — Lote com ${escapeHtml((p.clusterEscala.razoes || []).join(', '))}</span>
              <span style="font-size:11px;background:#fff;padding:2px 8px;border-radius:4px;border:1px solid #cbd5e1;color:#475569;">${p.clusterEscala.qtdProcessos} processos</span>
            </div>
          </td>
        </tr>
      `;
    }

    // Partes com rótulos contextuais (Reclamante/Reclamada, Recorrente/Recorrido, Agravante/Agravado)
    const rotulosPolos = obterRotulosPolosContextuais(p.classe.sigla, p.classe.rota);
    const ativos = (p.partes && p.partes.ativos) || [];
    const passivos = (p.partes && p.partes.passivos) || [];
    const htmlAtivos = formatarListaPartesPolo(ativos, rotulosPolos.poloAtivoRotulo, p.cnj);
    const htmlPassivos = formatarListaPartesPolo(passivos, rotulosPolos.poloPassivoRotulo, p.cnj);

    // Badges de PJ e Sindicato
    let badgesPj = '';
    if (p.pjs.temFazendaPublica) {
      badgesPj += `<span class="badge badge-fazenda" style="background:#e0f2fe;color:#0369a1;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;margin-right:4px;">FAZENDA PÚBLICA</span>`;
    }
    if (p.pjs.temRecuperacaoJudicial) {
      badgesPj += `<span class="badge badge-rj" style="background:#fef3c7;color:#b45309;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;margin-right:4px;">RECUPERAÇÃO JUDICIAL</span>`;
    }
    if (p.pjs.temMassaFalida) {
      badgesPj += `<span class="badge badge-falida" style="background:#f3e8ff;color:#7e22ce;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;margin-right:4px;">MASSA FALIDA</span>`;
    }
    if (p.sindicatos && p.sindicatos.temSindicato) {
      badgesPj += `<span class="badge badge-sindicato" style="background:#ccfbf1;color:#0f766e;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;margin-right:4px;">SINDICATO</span>`;
    }

    // Assuntos (truncados em 3)
    const assuntosItens = (p.assuntos && p.assuntos.itens) || [];
    let assuntosHtml = escapeHtml(assuntosItens.slice(0, 3).map(a => a.nome).join('; '));
    if (assuntosItens.length > 3) {
      assuntosHtml += ` <em style="color:#64748b;">(e mais ${assuntosItens.length - 3})</em>`;
    }

    // Alertas unificados
    const alertasBadges = [];

    // Alerta MPT caso Fazenda Pública não tenha intervenção cadastrada
    if (p.pjs.temFazendaPublica && !p.partes.mptPresente) {
      alertasBadges.push(`<span class="badge badge-mpt-alerta" style="background:#fee2e2;color:#b91c1c;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:700;">Fazenda Pública — incluir MPT</span>`);
    }

    // Processo Físico (simples e direto)
    if (p.temporalidade.ehProcessoFisicoMigrado) {
      alertasBadges.push(`<span class="badge badge-fisico" style="background:#ffedd5;color:#c2410c;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:600;">Processo físico</span>`);
    }

    // Processos Semelhantes (pedidos idênticos / mesma OAB)
    if (p.ehContenciosoEmEscala && p.clusterEscala) {
      const idEscala = `escala-${cnj.replace(/[^a-zA-Z0-9]/g, '_')}`;
      const rotuloEscala = p.clusterEscala.rotulo;
      const razoes = p.clusterEscala.razoes || ['mesmo cadastro de OAB', 'assuntos idênticos'];

      alertasBadges.push(`
        <div style="display:flex;flex-direction:column;gap:2px;width:100%;">
          <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
            <span class="badge badge-escala" style="background:#fef08a;color:#854d0e;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:600;" title="${escapeHtml(rotuloEscala)}">Processos semelhantes</span>
            <button type="button" class="btn-ver-lote-escala" data-target="${idEscala}" style="background:none;border:none;color:#854d0e;font-size:11px;cursor:pointer;text-decoration:underline;padding:0;">(ver motivo)</button>
          </div>
          <div id="${idEscala}" class="box-lote-escala" style="display:none;margin-top:4px;padding:8px 10px;background:#fefce8;border:1px solid #fef08a;border-radius:6px;font-size:11px;color:#713f12;max-width:280px;">
            <div style="font-weight:700;margin-bottom:4px;color:#854d0e;">Agrupado em razão de:</div>
            <ul style="margin:0;padding-left:14px;line-height:1.45;">
              ${razoes.map(rz => `<li style="margin-bottom:2px;">${escapeHtml(rz)}</li>`).join('')}
            </ul>
          </div>
        </div>
      `);
    }

    // Prevenção
    if (p.triagem && p.triagem.prevencao && p.triagem.prevencao.vinculaTurma) {
      alertasBadges.push(`<span class="badge badge-prevencao" style="background:#e0e7ff;color:#4338ca;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:600;" title="${escapeHtml(p.triagem.prevencao.descricao)}">Prevenção (${escapeHtml(p.triagem.prevencao.tipoPrevencao)})</span>`);
    }

    // Se não houver alertas, a célula fica vazia (sem rótulo de "nenhum alerta")
    const alertasHtml = alertasBadges.length > 0 
      ? alertasBadges.join('') 
      : '';

    // Estilização da linha com cor de lote se filtro ativo
    const corLoteAtual = (filtroSemelhantesAtivo && p.clusterEscala) ? mapaCoresCluster.get(p.clusterEscala.idCluster) : null;
    const estiloBordaLote = corLoteAtual ? `border-left: 4px solid ${corLoteAtual};` : '';
    const classeSelecionada = estaSelecionado ? 'linha-selecionada' : '';

    rowsHtml += `
      <tr class="linha-processo ${classeSelecionada}" data-cnj="${cnj}" tabindex="0" style="border-bottom:1px solid var(--border-subtle, #e2e8f0);cursor:pointer;${estiloBordaLote}">
        <td style="width:36px;padding:10px 6px;text-align:center;vertical-align:top;">
          <input type="checkbox" class="chk-processo" data-cnj="${cnj}" ${estaSelecionado ? 'checked' : ''} aria-label="Selecionar processo ${cnj}" style="cursor:pointer;">
        </td>
        <td style="width:190px;padding:10px 10px;vertical-align:top;">
          <div style="font-family:monospace;font-size:13px;font-weight:600;user-select:all;cursor:text;">${cnj}</div>
          <div style="display:flex;gap:6px;margin-top:4px;">
            <span style="background:#f1f5f9;color:#334155;padding:1px 5px;border-radius:3px;font-size:11px;font-weight:700;">${siglaClasse}</span>
            <span style="font-size:11px;color:#64748b;">${rota}</span>
          </div>
        </td>
        <td class="coluna-tempo-tarefa" style="width:120px;padding:10px 8px;vertical-align:top;font-size:12px;color:#334155;white-space:nowrap;">
          <div style="font-weight:600;">${dataDesdeStr}</div>
          <div style="font-size:10px;color:#94a3b8;">Na tarefa</div>
        </td>
        <td style="padding:10px 10px;vertical-align:top;">
          ${htmlAtivos}
          ${htmlPassivos}
          <div style="margin-top:6px;">${badgesPj}</div>
        </td>
        <td style="width:240px;padding:10px 10px;vertical-align:top;font-size:12px;line-height:1.4;">
          ${assuntosHtml}
        </td>
        <td style="width:200px;padding:10px 10px;vertical-align:top;">
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start;">
            ${alertasHtml}
          </div>
        </td>
      </tr>
    `;
  }

  const todosSelecionados = processosOrdenados.length > 0 && processosOrdenados.every(p => selecionadosSet.has(p.cnj));

  container.innerHTML = `
    <table class="tabela-triagem" style="width:100%;border-collapse:collapse;table-layout:fixed;text-align:left;">
      <thead>
        <tr style="background:var(--bg-muted, #f8fafc);border-bottom:2px solid var(--border-subtle, #cbd5e1);font-size:12px;color:var(--text-muted, #475569);text-transform:uppercase;">
          <th style="width:36px;padding:8px 6px;text-align:center;">
            <input type="checkbox" id="chk-selecionar-todos" ${todosSelecionados ? 'checked' : ''} aria-label="Selecionar todos os processos da listagem" title="Selecionar todos os visíveis" style="cursor:pointer;">
          </th>
          <th style="width:190px;padding:8px 10px;">Processo / Classe</th>
          <th id="th-ordenar-desde" style="width:120px;padding:8px 8px;cursor:pointer;user-select:none;" title="Clique para alternar ordenação por data na tarefa">
            Desde ${direcaoDesdeAsc ? '▲' : '▼'}
          </th>
          <th style="padding:8px 10px;">Partes &amp; Enquadramento</th>
          <th style="width:240px;padding:8px 10px;">Assuntos</th>
          <th style="width:200px;padding:8px 10px;">Alertas</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
      </tbody>
    </table>
  `;

  // Clique no cabeçalho Desde para alternar ordenação
  const thDesde = container.querySelector('#th-ordenar-desde');
  if (thDesde) {
    thDesde.addEventListener('click', () => {
      direcaoDesdeAsc = !direcaoDesdeAsc;
      renderizarTabela(container, listaProcessos, selecionadosSet, onSelecaoChange, estadoFiltros);
    });
  }

  // Interatividade do botão "ver mais partes"
  container.querySelectorAll('.btn-ver-mais-partes').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.getAttribute('data-target');
      const box = document.getElementById(targetId);
      if (box) {
        const estaAberto = box.style.display !== 'none';
        box.style.display = estaAberto ? 'none' : 'block';
        btn.textContent = estaAberto ? btn.textContent.replace('ocultar', 'ver todas') : 'ocultar partes extras';
      }
    });
  });

  // Interatividade do botão "ver motivo de escala"
  container.querySelectorAll('.btn-ver-lote-escala').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.getAttribute('data-target');
      const box = document.getElementById(targetId);
      if (box) {
        const estaAberto = box.style.display !== 'none';
        box.style.display = estaAberto ? 'none' : 'block';
        btn.textContent = estaAberto ? '(ver motivo)' : '(ocultar motivo)';
      }
    });
  });

  // Interatividade de seleção
  const chkMaster = container.querySelector('#chk-selecionar-todos');
  if (chkMaster) {
    chkMaster.addEventListener('change', (e) => {
      const marcado = e.target.checked;
      for (const p of processosOrdenados) {
        if (marcado) {
          selecionadosSet.add(p.cnj);
        } else {
          selecionadosSet.delete(p.cnj);
        }
      }
      if (typeof onSelecaoChange === 'function') {
        onSelecaoChange(selecionadosSet);
      }
    });
  }

  container.querySelectorAll('.chk-processo').forEach(chk => {
    chk.addEventListener('change', (e) => {
      const cnj = e.target.getAttribute('data-cnj');
      if (e.target.checked) {
        selecionadosSet.add(cnj);
      } else {
        selecionadosSet.delete(cnj);
      }
      if (typeof onSelecaoChange === 'function') {
        onSelecaoChange(selecionadosSet);
      }
    });
  });

  // ==========================================================
  // ERGONOMIA KEYBOARD-FIRST (REC-01)
  // Setas (↑/↓), Espaço p/ Selecionar, C p/ Copiar CNJ, Enter p/ Abrir
  // ==========================================================
  const linhasProcessos = Array.from(container.querySelectorAll('tbody tr.linha-processo'));
  let indiceFocado = -1;

  function mostrarMicroToast(msg) {
    let t = document.getElementById('toast-tabela-triagem');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast-tabela-triagem';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function focarLinha(novoIdx) {
    if (linhasProcessos.length === 0) return;
    novoIdx = Math.max(0, Math.min(novoIdx, linhasProcessos.length - 1));
    linhasProcessos.forEach((l, i) => {
      if (i === novoIdx) {
        l.classList.add('linha-em-foco');
        l.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        l.focus({ preventScroll: true });
      } else {
        l.classList.remove('linha-em-foco');
      }
    });
    indiceFocado = novoIdx;
  }

  linhasProcessos.forEach((tr, i) => {
    tr.addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'A') {
        focarLinha(i);
      }
    });
  });

  if (container._handlerTecladoTabela) {
    document.removeEventListener('keydown', container._handlerTecladoTabela);
  }

  container._handlerTecladoTabela = (e) => {
    // Ignora atalhos se o usuário estiver digitando em campo de texto
    const tag = document.activeElement && document.activeElement.tagName;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) && document.activeElement.type !== 'checkbox') {
      return;
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      focarLinha(indiceFocado + 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      focarLinha(indiceFocado <= 0 ? 0 : indiceFocado - 1);
    } else if (e.key === ' ' && indiceFocado >= 0) {
      e.preventDefault();
      const tr = linhasProcessos[indiceFocado];
      const chk = tr && tr.querySelector('.chk-processo');
      if (chk) {
        chk.checked = !chk.checked;
        chk.dispatchEvent(new Event('change'));
      }
    } else if ((e.key === 'c' || e.key === 'C') && !e.altKey && indiceFocado >= 0) {
      const tr = linhasProcessos[indiceFocado];
      const cnj = tr && tr.getAttribute('data-cnj');
      if (cnj) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cnj).then(() => {
            mostrarMicroToast(`CNJ copiado: ${cnj}`);
          }).catch(() => {
            mostrarMicroToast(`CNJ: ${cnj}`);
          });
        } else {
          mostrarMicroToast(`CNJ: ${cnj}`);
        }
      }
    } else if (e.key === 'Enter' && indiceFocado >= 0) {
      const tr = linhasProcessos[indiceFocado];
      const cnj = tr && tr.getAttribute('data-cnj');
      if (cnj) {
        mostrarMicroToast(`Processo selecionado: ${cnj}`);
      }
    }
  };

  document.addEventListener('keydown', container._handlerTecladoTabela);
}

/**
 * Módulo de filtros e facetas da interface.
 */

function criarGerenciadorFiltros(processos, onFiltrosAlterados) {
  const estado = {
    buscaTexto: '',
    rota: 'TODAS',
    classesSelecionadas: new Set(), // Set de siglas selecionadas (vazio = todas)
    apenasFazendaSemMpt: false,
    apenasRecuperacaoJudicial: false,
    apenasMassaFalida: false,
    apenasSindicato: false,
    apenasContenciosoEscala: false,
    apenasFisicosMigrados: false,
    agrupamentoAtivo: null // { tipo: 'reclamada'|'patrono'|'assunto'|'escala'|'todos_escala', valor: string }
  };

  function aplicarFiltros() {
    let filtrados = processos.slice();

    // 1. Busca textual (CNJ, partes, patronos, assuntos)
    if (estado.buscaTexto) {
      const q = estado.buscaTexto.toLowerCase();
      filtrados = filtrados.filter(p => {
        const cnj = (p.cnj || '').toLowerCase();
        const partes = (p.partes && p.partes.tituloPartes || '').toLowerCase();
        const patronos = (p.partes && p.partes.patronos.map(pat => pat.nome + ' ' + pat.numeroOab).join(' ') || '').toLowerCase();
        const assuntos = (p.assuntos && p.assuntos.itens.map(a => a.nome).join(' ') || '').toLowerCase();
        return cnj.includes(q) || partes.includes(q) || patronos.includes(q) || assuntos.includes(q);
      });
    }

    // 2. Filtro de Rota
    if (estado.rota !== 'TODAS') {
      filtrados = filtrados.filter(p => p.classe.rota === estado.rota);
    }

    // 3. Filtro de Classes Múltiplas (Checkboxes)
    if (estado.classesSelecionadas.size > 0) {
      filtrados = filtrados.filter(p => estado.classesSelecionadas.has(p.classe.sigla));
    }

    // 4. Facetas booleanas
    if (estado.apenasFazendaSemMpt) {
      filtrados = filtrados.filter(p => p.pjs.temFazendaPublica && !p.partes.mptPresente);
    }
    if (estado.apenasRecuperacaoJudicial) {
      filtrados = filtrados.filter(p => p.pjs.temRecuperacaoJudicial);
    }
    if (estado.apenasMassaFalida) {
      filtrados = filtrados.filter(p => p.pjs.temMassaFalida);
    }
    if (estado.apenasSindicato) {
      filtrados = filtrados.filter(p => p.sindicatos && p.sindicatos.temSindicato);
    }
    if (estado.apenasContenciosoEscala) {
      filtrados = filtrados.filter(p => p.ehContenciosoEmEscala);
    }
    if (estado.apenasFisicosMigrados) {
      filtrados = filtrados.filter(p => p.temporalidade.ehProcessoFisicoMigrado);
    }

    // 5. Agrupamento ativo via clique no painel superior
    if (estado.agrupamentoAtivo) {
      const { tipo, valor } = estado.agrupamentoAtivo;
      if (tipo === 'reclamada') {
        const alvo = valor.toUpperCase();
        filtrados = filtrados.filter(p => {
          const passivos = (p.partes && p.partes.passivos) || [];
          return passivos.some(r => (r.nome || '').toUpperCase().includes(alvo));
        });
      } else if (tipo === 'patrono') {
        filtrados = filtrados.filter(p => {
          const pats = (p.partes && p.partes.patronos) || [];
          return pats.some(pat => (pat.nome || '').includes(valor) || (pat.numeroOab || '').includes(valor));
        });
      } else if (tipo === 'assunto') {
        filtrados = filtrados.filter(p => {
          const itens = (p.assuntos && p.assuntos.itens) || [];
          return itens.some(a => (a.nome || '').includes(valor));
        });
      } else if (tipo === 'escala') {
        filtrados = filtrados.filter(p => p.clusterEscala && p.clusterEscala.idCluster === valor);
      } else if (tipo === 'todos_escala') {
        filtrados = filtrados.filter(p => p.ehContenciosoEmEscala);
      }
    }

    if (typeof onFiltrosAlterados === 'function') {
      onFiltrosAlterados(filtrados, estado);
    }
  }

  function renderizar(container) {
    if (!container) return;

    // Extrai classes dinamicamente
    const classesDisponiveis = Array.from(new Set(processos.map(p => p.classe.sigla))).sort();

    container.innerHTML = `
      <div class="painel-filtros" style="display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--bg-surface, #fff);border:1px solid var(--border-subtle, #e2e8f0);border-radius:8px;margin-bottom:16px;">
        
        <!-- Linha Superior: Busca e Rota -->
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
          <div style="flex:1;min-width:240px;">
            <input type="text" id="filtro-busca" value="${estado.buscaTexto}" placeholder="Buscar por CNJ, Parte, Advogado ou Assunto..." style="width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;box-sizing:border-box;">
          </div>

          <div>
            <select id="filtro-rota" style="padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;background:#fff;">
              <option value="TODAS" ${estado.rota === 'TODAS' ? 'selected' : ''}>Todas as Fases</option>
              <option value="CONHECIMENTO" ${estado.rota === 'CONHECIMENTO' ? 'selected' : ''}>Fase de Conhecimento</option>
              <option value="EXECUCAO" ${estado.rota === 'EXECUCAO' ? 'selected' : ''}>Fase de Execução</option>
            </select>
          </div>

          ${estado.agrupamentoAtivo ? `
            <div id="badge-agrupamento-ativo" style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#e0e7ff;border:1px solid #c7d2fe;border-radius:6px;font-size:12px;font-weight:600;color:#3730a3;">
              <span>Agrupamento: ${estado.agrupamentoAtivo.tipo === 'todos_escala' ? 'Processos Semelhantes' : estado.agrupamentoAtivo.valor}</span>
              <button type="button" id="btn-remover-agrupamento" style="background:none;border:none;color:#4338ca;cursor:pointer;font-weight:700;padding:0 2px;">✕</button>
            </div>
          ` : ''}
        </div>

        <!-- Linha do Meio: Seleção Múltipla de Classes Processuais -->
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:12px;font-weight:700;color:#475569;margin-right:4px;">Classes:</span>
          ${classesDisponiveis.map(sigla => {
            const checked = estado.classesSelecionadas.has(sigla) ? 'checked' : '';
            return `
              <label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;padding:4px 8px;background:${checked ? '#eff6ff' : '#f8fafc'};border:1px solid ${checked ? '#93c5fd' : '#e2e8f0'};border-radius:4px;user-select:none;">
                <input type="checkbox" class="chk-filtro-classe" data-sigla="${sigla}" ${checked}> ${sigla}
              </label>
            `;
          }).join('')}
          ${estado.classesSelecionadas.size > 0 ? `
            <button type="button" id="btn-limpar-classes" style="background:none;border:none;color:#2563eb;font-size:11px;cursor:pointer;padding:2px 6px;text-decoration:underline;">Limpar classes</button>
          ` : ''}
        </div>

        <!-- Linha Inferior: Facetas e Alertas de Triagem -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <span style="font-size:12px;font-weight:700;color:#475569;margin-right:4px;">Filtros:</span>
          
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:6px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;">
            <input type="checkbox" id="chk-fazenda-sem-mpt" ${estado.apenasFazendaSemMpt ? 'checked' : ''}> Fazenda sem MPT
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:6px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;">
            <input type="checkbox" id="chk-rec-judicial" ${estado.apenasRecuperacaoJudicial ? 'checked' : ''}> Rec. Judicial
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:6px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;">
            <input type="checkbox" id="chk-massa-falida" ${estado.apenasMassaFalida ? 'checked' : ''}> Massa Falida
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:6px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;">
            <input type="checkbox" id="chk-sindicato" ${estado.apenasSindicato ? 'checked' : ''}> Sindicato
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:6px 10px;background:#fef08a;border:1px solid #fde047;border-radius:6px;font-weight:600;color:#854d0e;">
            <input type="checkbox" id="chk-contencioso-escala" ${estado.apenasContenciosoEscala ? 'checked' : ''}> Processos semelhantes
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:6px 10px;background:#ffedd5;border:1px solid #fed7aa;border-radius:6px;">
            <input type="checkbox" id="chk-fisico-migrado" ${estado.apenasFisicosMigrados ? 'checked' : ''}> Processo físico
          </label>
        </div>
      </div>
    `;

    // Event listeners
    const inputBusca = container.querySelector('#filtro-busca');
    inputBusca.addEventListener('input', (e) => {
      estado.buscaTexto = e.target.value.trim();
      aplicarFiltros();
    });

    const selectRota = container.querySelector('#filtro-rota');
    selectRota.addEventListener('change', (e) => {
      estado.rota = e.target.value;
      aplicarFiltros();
    });

    // Checkboxes múltiplos de classe
    container.querySelectorAll('.chk-filtro-classe').forEach(chk => {
      chk.addEventListener('change', (e) => {
        const sigla = e.target.getAttribute('data-sigla');
        if (e.target.checked) {
          estado.classesSelecionadas.add(sigla);
        } else {
          estado.classesSelecionadas.delete(sigla);
        }
        aplicarFiltros();
        renderizar(container);
      });
    });

    const btnLimparClasses = container.querySelector('#btn-limpar-classes');
    if (btnLimparClasses) {
      btnLimparClasses.addEventListener('click', () => {
        estado.classesSelecionadas.clear();
        aplicarFiltros();
        renderizar(container);
      });
    }

    const chkFazenda = container.querySelector('#chk-fazenda-sem-mpt');
    chkFazenda.addEventListener('change', (e) => {
      estado.apenasFazendaSemMpt = e.target.checked;
      aplicarFiltros();
    });

    const chkRecJudicial = container.querySelector('#chk-rec-judicial');
    chkRecJudicial.addEventListener('change', (e) => {
      estado.apenasRecuperacaoJudicial = e.target.checked;
      aplicarFiltros();
    });

    const chkMassaFalida = container.querySelector('#chk-massa-falida');
    chkMassaFalida.addEventListener('change', (e) => {
      estado.apenasMassaFalida = e.target.checked;
      aplicarFiltros();
    });

    const chkSindicato = container.querySelector('#chk-sindicato');
    chkSindicato.addEventListener('change', (e) => {
      estado.apenasSindicato = e.target.checked;
      aplicarFiltros();
    });

    const chkEscala = container.querySelector('#chk-contencioso-escala');
    chkEscala.addEventListener('change', (e) => {
      estado.apenasContenciosoEscala = e.target.checked;
      aplicarFiltros();
    });

    const chkFisico = container.querySelector('#chk-fisico-migrado');
    chkFisico.addEventListener('change', (e) => {
      estado.apenasFisicosMigrados = e.target.checked;
      aplicarFiltros();
    });

    const btnRemoverAgrupamento = container.querySelector('#btn-remover-agrupamento');
    if (btnRemoverAgrupamento) {
      btnRemoverAgrupamento.addEventListener('click', () => {
        estado.agrupamentoAtivo = null;
        aplicarFiltros();
        renderizar(container);
      });
    }
  }

  return {
    renderizar,
    aplicarFiltros,
    setAgrupamento: (agrupamento, container) => {
      estado.agrupamentoAtivo = agrupamento;
      aplicarFiltros();
      if (container) renderizar(container);
    },
    setEstado: (novoEstado) => {
      Object.assign(estado, novoEstado);
      aplicarFiltros();
    }
  };
}
